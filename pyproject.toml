[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assets2036py"
version = "0.2.0"
description = "helper library to easily implement assets2036"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Daniel Ewert", email = "Daniel.Ewert@de.bosch.com"}
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "jsonschema>=4.0,<5.0",
    "paho-mqtt>=2.0,<3.0",
    "python-dateutil>=2.8,<3.0"
]

[project.urls]
Homepage = "https://github.com/boschresearch/assets2036py"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "amqtt>=0.11",
    "ruff>=0.5"
]

[tool.hatch.build.targets.wheel]
packages = ["assets2036py"]

[tool.pytest.ini_options]
markers = [
    "network: marks tests requiring external network access (deselect with '-m not network')"
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
